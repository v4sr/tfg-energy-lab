services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    expose:
      - "9091"
    networks:
      - monitoring
      - front-lb
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=https://${TFG_MONITORING_HOST}/prometheus/"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DATA_DIR}/prometheus:/prometheus
    networks:
      - monitoring
      - front-lb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SERVER_DOMAIN: ${TFG_MONITORING_HOST}
      GF_SERVER_ROOT_URL: https://${TFG_MONITORING_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_PROTOCOL: http
    expose:
      - "3000"
    volumes:
      - ${MONITORING_DATA_DIR}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/tfg-energy:ro
    networks:
      - monitoring
      - front-lb
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  front-lb:
    external: true
