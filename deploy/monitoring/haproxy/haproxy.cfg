global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend http
    bind *:80

    acl is_acme path_beg /.well-known/acme-challenge/
    acl host_tfg hdr(host) -i tfg-energy-lab.vasr.es

    http-request redirect scheme https code 301 unless is_acme
    use_backend certbot_acme if is_acme
    default_backend not_found

frontend https
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443

    acl host_tfg hdr(host) -i tfg-energy-lab.vasr.es
    acl grafana_noslash path -i /grafana
    acl prometheus_noslash path -i /prometheus
    acl pushgateway_noslash path -i /pushgateway

    http-request redirect location /grafana/ code 301 if host_tfg grafana_noslash
    http-request redirect location /prometheus/ code 301 if host_tfg prometheus_noslash
    http-request redirect location /pushgateway/ code 301 if host_tfg pushgateway_noslash

    acl path_grafana path_beg /grafana/
    acl path_prometheus path_beg /prometheus/
    acl path_pushgateway path_beg /pushgateway/

    use_backend grafana if host_tfg path_grafana
    use_backend prometheus if host_tfg path_prometheus
    use_backend pushgateway if host_tfg path_pushgateway
    default_backend not_found

backend grafana
    http-request set-header Host tfg-energy-lab.vasr.es
    http-request set-header X-Forwarded-Host tfg-energy-lab.vasr.es
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Forwarded-Prefix /grafana
    server grafana grafana:3000 check

backend prometheus
    server prometheus prometheus:9090 check

backend pushgateway
    http-request replace-path ^/pushgateway(/)?(.*)$ /\2
    server pushgateway pushgateway:9091 check

backend certbot_acme
    server certbot-web certbot-web:80

backend not_found
    http-request return status 404 content-type text/plain string "Unknown host"
