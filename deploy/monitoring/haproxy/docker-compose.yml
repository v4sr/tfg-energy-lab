services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: front-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${HAPROXY_CERTS_DIR}:/usr/local/etc/haproxy/certs:ro
    networks:
      - front-lb
    restart: unless-stopped

  certbot-web:
    image: nginx:alpine
    container_name: certbot-web
    volumes:
      - ${CERTBOT_WEBROOT_DIR}:/usr/share/nginx/html:ro
    networks:
      - front-lb
    restart: unless-stopped

networks:
  front-lb:
    external: true
